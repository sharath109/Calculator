<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colorful Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Calculator -->
    <div class="calculator">

        <!-- Display -->
        <input
            type="text"
            id="display"
            disabled
            placeholder="0"
        >

        <!-- Calculator Buttons -->
        <div class="buttons">

            <!-- Row 1 -->
            <button
                class="clear"
                onclick="clearDisplay()">
                C
            </button>

            <button
                class="backspace"
                onclick="deleteLast()">
                ⌫
            </button>

            <button
                class="operator"
                onclick="appendValue('/')">
                ÷
            </button>

            <button
                class="operator"
                onclick="appendValue('*')">
                ×
            </button>


            <!-- Row 2 -->
            <button
                class="number"
                onclick="appendValue('7')">
                7
            </button>

            <button
                class="number"
                onclick="appendValue('8')">
                8
            </button>

            <button
                class="number"
                onclick="appendValue('9')">
                9
            </button>

            <button
                class="operator"
                onclick="appendValue('-')">
                −
            </button>


            <!-- Row 3 -->
            <button
                class="number"
                onclick="appendValue('4')">
                4
            </button>

            <button
                class="number"
                onclick="appendValue('5')">
                5
            </button>

            <button
                class="number"
                onclick="appendValue('6')">
                6
            </button>

            <button
                class="operator"
                onclick="appendValue('+')">
                +
            </button>


            <!-- Row 4 -->
            <button
                class="number"
                onclick="appendValue('1')">
                1
            </button>

            <button
                class="number"
                onclick="appendValue('2')">
                2
            </button>

            <button
                class="number"
                onclick="appendValue('3')">
                3
            </button>

            <button
                class="equal"
                onclick="calculate()">
                =
            </button>


            <!-- Row 5 -->
            <button
                class="number zero"
                onclick="appendValue('0')">
                0
            </button>

            <button
                class="decimal"
                onclick="appendValue('.')">
                .
            </button>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
